<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messagerie — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#f8fafc; font-family:"Inter",sans-serif; margin:0; }
    .msg-layout { display:flex; height:calc(100vh - 70px); max-width:1200px; margin:0 auto; background:#fff; border-left:1px solid #e2e8f0; border-right:1px solid #e2e8f0; }
    .msg-sidebar { width:320px; flex-shrink:0; border-right:1px solid #e2e8f0; display:flex; flex-direction:column; }
    .msg-sidebar-header { padding:20px 20px 12px; border-bottom:1px solid #e2e8f0; }
    .msg-sidebar-header h2 { font-size:18px; font-weight:800; color:#0f172a; margin:0 0 12px; }
    .msg-search { width:100%; padding:9px 14px; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; font-family:inherit; box-sizing:border-box; outline:none; }
    .msg-search:focus { border-color:#f5a623; }
    .conv-list { flex:1; overflow-y:auto; }
    .conv-item { display:flex; align-items:center; gap:12px; padding:14px 20px; cursor:pointer; border-bottom:1px solid #f1f5f9; transition:background 0.15s; }
    .conv-item:hover { background:#f8fafc; }
    .conv-item.active { background:#fef3c7; border-left:3px solid #f5a623; }
    .conv-avatar { width:44px; height:44px; border-radius:50%; background:#e2e8f0; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#64748b; }
    .conv-info { flex:1; min-width:0; }
    .conv-name { font-size:14px; font-weight:700; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conv-preview { font-size:12px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .conv-meta { text-align:right; flex-shrink:0; }
    .conv-time { font-size:11px; color:#94a3b8; }
    .conv-empty { text-align:center; padding:40px 20px; color:#94a3b8; font-size:14px; }
    .msg-chat { flex:1; display:flex; flex-direction:column; }
    .chat-header { padding:16px 24px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; gap:14px; background:#fff; flex-wrap:wrap; }
    .chat-header-avatar { width:42px; height:42px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#64748b; flex-shrink:0; }
    .chat-header-info { flex:1; }
    .chat-header-name { font-size:16px; font-weight:700; color:#0f172a; }
    .chat-header-status { font-size:12px; color:#16a34a; font-weight:600; }
    .chat-messages { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; background:#f8fafc; }
    .msg-bubble-wrap { display:flex; }
    .msg-bubble-wrap.me { justify-content:flex-end; }
    .msg-bubble-wrap.them { justify-content:flex-start; }
    .msg-bubble { max-width:65%; padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.5; }
    .msg-bubble-wrap.me .msg-bubble { background:#f5a623; color:#fff; border-bottom-right-radius:4px; }
    .msg-bubble-wrap.them .msg-bubble { background:#fff; color:#1e293b; border:1px solid #e2e8f0; border-bottom-left-radius:4px; }
    .msg-time { font-size:10px; color:rgba(255,255,255,0.75); margin-top:4px; text-align:right; }
    .msg-bubble-wrap.them .msg-time { color:#94a3b8; }
    .msg-sender-name { font-size:11px; font-weight:700; color:#64748b; margin-bottom:4px; }
    .chat-input-bar { padding:16px 24px; border-top:1px solid #e2e8f0; display:flex; gap:12px; align-items:flex-end; background:#fff; }
    .chat-input-bar textarea { flex:1; border:1px solid #e2e8f0; border-radius:12px; padding:12px 16px; font-family:inherit; font-size:14px; resize:none; outline:none; max-height:120px; line-height:1.5; }
    .chat-input-bar textarea:focus { border-color:#f5a623; }
    .chat-send-btn { background:#f5a623; border:none; border-radius:12px; padding:12px 20px; color:#fff; font-size:18px; cursor:pointer; }
    .chat-send-btn:hover { background:#e0941e; }
    .chat-empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#94a3b8; gap:12px; background:#f8fafc; }
    .chat-empty-state .icon { font-size:48px; }
    .chat-empty-state h3 { font-size:18px; font-weight:700; color:#64748b; margin:0; }
    .devis-badge { background:#fef3c7; border:1px solid #fcd34d; border-radius:8px; padding:6px 12px; font-size:12px; color:#92400e; font-weight:600; }
    .chat-system-msg { text-align:center; font-size:12px; color:#94a3b8; background:#f1f5f9; border-radius:20px; padding:4px 12px; align-self:center; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-actions">
        <a href="panier.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></a>
        <a href="dashboard.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="categories.html">Catégories</a>
      <a href="fournisseurs.html">Fournisseurs</a>
      <a href="messagerie.html" class="active">Messagerie</a>
    </div>
  </nav>

  <div class="msg-layout">
    <div class="msg-sidebar">
      <div class="msg-sidebar-header">
        <h2>Messagerie</h2>
        <input type="text" class="msg-search" placeholder="Rechercher..." oninput="filterConversations(this.value)">
      </div>
      <div class="conv-list" id="conv-list">
        <div class="conv-empty">Chargement des conversations...</div>
      </div>
    </div>

    <div class="msg-chat" id="msg-chat">
      <div class="chat-empty-state" id="chat-empty-state">
        <div class="icon">💬</div>
        <h3>Vos messages</h3>
        <p>Sélectionnez une conversation pour commencer</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    let currentUser = null;
    let allConversations = [];
    let activeConvId = null;
    let pollInterval = null;

    document.addEventListener("DOMContentLoaded", async () => {
      currentUser = getCurrentUser();
      if (!currentUser) { window.location.href = "connexion.html"; return; }
      const params = new URLSearchParams(window.location.search);
      await loadConversations(params.get("devis"));
    });

    async function loadConversations(autoOpenId) {
      const client = getSupabaseClient();
      const convList = document.getElementById("conv-list");
      if (!client) { convList.innerHTML = "<div class='conv-empty'>Erreur de connexion.</div>"; return; }
      try {
        const { data: d1 } = await client.from("devis").select("*").eq("merchant_id", currentUser.id);
        const { data: d2 } = await client.from("devis").select("*").eq("supplier_id", currentUser.id);
        const all = [...(d1 || []), ...(d2 || [])];
        const seen = new Set();
        allConversations = all.filter(d => { if (seen.has(d.id)) return false; seen.add(d.id); return true; });
        allConversations.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        renderConvList(allConversations);
        if (autoOpenId) {
          const t = allConversations.find(d => d.id === autoOpenId);
          if (t) openConversation(t);
        } else if (allConversations.length > 0) {
          openConversation(allConversations[0]);
        }
      } catch (err) {
        convList.innerHTML = "<div class='conv-empty'>Impossible de charger les conversations.</div>";
      }
    }

    function renderConvList(conversations) {
      const convList = document.getElementById("conv-list");
      if (!conversations.length) {
        convList.innerHTML = "<div class='conv-empty'><div style='font-size:32px;margin-bottom:8px;'>📭</div><div>Aucune conversation.</div><div style='margin-top:8px;font-size:12px;'>Contactez un fournisseur depuis une fiche produit.</div></div>";
        return;
      }
      convList.innerHTML = conversations.map(d => {
        const isMerchant = d.merchant_id === currentUser.id;
        const otherLabel = isMerchant ? (d.items && d.items[0] && d.items[0].supplier ? d.items[0].supplier : "Fournisseur AfroBaza") : "Commerçant";
        const ref = d.reference || d.devis_number || ("DEV-" + d.id.slice(0,6));
        const preview = d.message ? d.message.slice(0,55) + (d.message.length > 55 ? "..." : "") : "Demande de devis";
        const timeStr = d.created_at ? new Date(d.created_at).toLocaleDateString("fr-FR") : "";
        const initial = otherLabel.charAt(0).toUpperCase();
        const isActive = activeConvId === d.id;
        return "<div class='conv-item" + (isActive ? " active" : "") + "' id='conv-" + d.id + "' onclick='openConvById(\"" + d.id + "\")'>" +
          "<div class='conv-avatar'>" + initial + "</div>" +
          "<div class='conv-info'><div class='conv-name'>" + otherLabel + "</div><div class='conv-preview'>" + preview + "</div></div>" +
          "<div class='conv-meta'><div class='conv-time'>" + timeStr + "</div></div></div>";
      }).join("");
    }

    function openConvById(id) {
      const d = allConversations.find(c => c.id === id);
      if (d) openConversation(d);
    }

    function filterConversations(query) {
      const q = query.toLowerCase();
      const filtered = allConversations.filter(d => {
        const label = (d.items && d.items[0] && d.items[0].supplier) || d.message || "";
        return label.toLowerCase().includes(q) || (d.reference || "").toLowerCase().includes(q);
      });
      renderConvList(filtered);
    }

    function openConversation(devis) {
      activeConvId = devis.id;
      document.querySelectorAll(".conv-item").forEach(el => el.classList.remove("active"));
      const el = document.getElementById("conv-" + devis.id);
      if (el) el.classList.add("active");

      const isMerchant = devis.merchant_id === currentUser.id;
      const otherLabel = isMerchant ? ((devis.items && devis.items[0] && devis.items[0].supplier) || "Fournisseur AfroBaza") : "Commerçant";
      const ref = devis.reference || devis.devis_number || ("DEV-" + devis.id.slice(0,6));
      const initial = otherLabel.charAt(0).toUpperCase();
      const productLine = devis.items && devis.items[0];
      const statusMap = { pending: "En attente", sent: "Envoyé", accepted: "Accepté", refused: "Refusé" };

      const chatEl = document.getElementById("msg-chat");
      chatEl.innerHTML =
        "<div class='chat-header'>" +
          "<div class='chat-header-avatar'>" + initial + "</div>" +
          "<div class='chat-header-info'>" +
            "<div class='chat-header-name'>" + otherLabel + "</div>" +
            "<div class='chat-header-status'>Fournisseur vérifié AfroBaza</div>" +
          "</div>" +
          "<div style='display:flex;gap:8px;flex-wrap:wrap;'>" +
            (productLine ? "<span class='devis-badge'>Produit : " + (productLine.name || "Produit") + " x" + (productLine.qty || 1) + "</span>" : "") +
            "<span class='devis-badge' style='background:#f0fdf4;border-color:#86efac;color:#166534;'>Ref. " + ref + "</span>" +
            "<span class='devis-badge' style='background:#f1f5f9;border-color:#cbd5e1;color:#475569;'>Statut : " + (statusMap[devis.status] || devis.status) + "</span>" +
          "</div>" +
        "</div>" +
        "<div class='chat-messages' id='chat-messages'>" +
          "<div class='chat-system-msg'>Conversation démarrée</div>" +
          "<div style='text-align:center;color:#94a3b8;font-size:13px;padding:20px;'>Chargement des messages...</div>" +
        "</div>" +
        "<div class='chat-input-bar'>" +
          "<textarea id='chat-input' placeholder='Écrivez votre message...' rows='1' onkeydown='handleKeyDown(event)'></textarea>" +
          "<button class='chat-send-btn' onclick='sendMessage()'>&#10148;</button>" +
        "</div>";

      clearInterval(pollInterval);
      loadMessages();
      pollInterval = setInterval(loadMessages, 4000);
    }

    async function loadMessages() {
      if (!activeConvId) return;
      const client = getSupabaseClient();
      const container = document.getElementById("chat-messages");
      if (!client || !container) return;
      try {
        const { data: devisData } = await client.from("devis").select("message,created_at,merchant_id").eq("id", activeConvId).single();
        const { data: msgs } = await client.from("messages").select("*").eq("devis_id", activeConvId).order("created_at", { ascending: true });
        const allMsgs = [];
        if (devisData && devisData.message) {
          allMsgs.push({ sender_id: devisData.merchant_id, message: devisData.message, created_at: devisData.created_at, isInitial: true });
        }
        (msgs || []).forEach(m => allMsgs.push(m));

        if (!allMsgs.length) {
          container.innerHTML = "<div class='chat-system-msg'>Conversation démarrée</div><div style='text-align:center;color:#94a3b8;font-size:13px;padding:30px;'>Aucun message pour l'instant.<br>Commencez la discussion ci-dessous.</div>";
          return;
        }
        const wasAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 10;
        container.innerHTML = "<div class='chat-system-msg'>Début de la conversation</div>" +
          allMsgs.map(m => {
            const isMe = m.sender_id === currentUser.id;
            const timeStr = new Date(m.created_at).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
            const dateStr = new Date(m.created_at).toLocaleDateString("fr-FR", { day:"numeric", month:"short" });
            return "<div class='msg-bubble-wrap " + (isMe ? "me" : "them") + "'><div>" +
              (!isMe ? "<div class='msg-sender-name'>" + (m.isInitial ? "Message initial" : "Interlocuteur") + "</div>" : "") +
              "<div class='msg-bubble'>" +
              (m.isInitial ? "<em style='font-size:11px;opacity:0.8;'>Message initial :</em><br>" : "") +
              m.message +
              "<div class='msg-time'>" + dateStr + " " + timeStr + "</div>" +
              "</div></div></div>";
          }).join("");
        if (wasAtBottom) container.scrollTop = container.scrollHeight;
      } catch (err) { console.error("Erreur chargement messages:", err); }
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      if (!input) return;
      const text = input.value.trim();
      if (!text || !activeConvId) return;
      const client = getSupabaseClient();
      if (!client) { showToast("Erreur de connexion", "error"); return; }
      input.disabled = true;
      try {
        const { error } = await client.from("messages").insert([{ devis_id: activeConvId, sender_id: currentUser.id, message: text }]);
        if (error) throw error;
        input.value = "";
        input.style.height = "auto";
        await loadMessages();
      } catch (err) {
        showToast("Erreur d'envoi : " + err.message, "error");
      } finally {
        input.disabled = false;
        input.focus();
      }
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      const ta = e.target;
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    }

    window.addEventListener("beforeunload", () => clearInterval(pollInterval));
  </script>
</body>
</html>
