<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AfroBaza">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#F4B400">
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-actions">
        <a href="inscription.html" class="btn-primary">s'inscrire</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Connexion</h1>
      <p class="auth-sub">Bienvenue de retour sur AfroBaza !</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" class="form-control" placeholder="Entrez votre mot de passe" required>
        </div>
        <button type="submit" class="btn-primary auth-submit" id="submit-btn">Se connecter à AfroBaza</button>
      </form>

      <div class="auth-footer">
        Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
      </div>
    </div>
  </div>

  <!-- SDK SUPABASE JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Connexion en cours... ⏳';
      btn.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const result = await loginUser(email, password);

      if (result.error) {
        showToast('❌ Erreur : ' + result.error, 'error');
        btn.textContent = 'Se connecter à AfroBaza';
        btn.disabled = false;
      } else {
        showToast(`✓ Connexion réussie ! Bienvenue ${result.data.name}`, 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1200);
      }
    }
  </script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then(reg => {
        console.log("[AfroBaza PWA] Service Worker enregistr� :", reg.scope);
      }).catch(err => console.warn("[AfroBaza PWA] SW �chec :", err));
    });
  }
</script>
</body>
</html>
