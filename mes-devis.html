<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes devis — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-actions">
        <a href="panier.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></a>
        <a href="dashboard.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="categories.html">Catégories</a>
      <a href="fournisseurs.html">Fournisseurs vérifiés</a>
      <a href="vendre.html">Vendre sur AfroBaza</a>
    </div>
  </nav>

  <div class="account-layout">
    <aside class="account-sidebar">
      <div class="user-avatar-wrap">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80" alt="Avatar" class="user-avatar">
        <div style="font-weight:700;" id="sidebar-user-name">Chargement...</div>
        <div style="font-size:12px;color:var(--gray);text-transform:capitalize;" id="sidebar-user-role">...</div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Tableau de bord</a>
        <a href="mes-devis.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Mes devis</a>
      </nav>
    </aside>

    <main class="account-content">
      <h1>Mes devis</h1>
      <p class="subtitle">Suivez l'état de vos demandes de devis enregistrées dans Supabase</p>

      <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
        <button class="btn-primary" onclick="filterDevis('all',this)">Tous</button>
        <button class="btn-outline" onclick="filterDevis('sent',this)">Envoyés</button>
        <button class="btn-outline" onclick="filterDevis('accepted',this)">Acceptés</button>
        <button class="btn-outline" onclick="filterDevis('refused',this)">Refusés</button>
      </div>

      <table class="devis-table" id="devis-table">
        <thead>
          <tr>
            <th>N° Devis</th>
            <th>Fournisseur / Client</th>
            <th>Montant total</th>
            <th>Statut</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="devis-tbody">
          <tr><td colspan="5" style="text-align:center;padding:30px;color:#666;">Chargement de vos devis depuis Supabase...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <!-- SDK SUPABASE JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    let userDevis = [];

    const STATUS_LABELS = { sent: 'Envoyé', accepted: 'Accepté', refused: 'Refusé', pending: 'En attente' };
    const STATUS_CLASSES = { sent: 'badge-sent', accepted: 'badge-accepted', refused: 'badge-refused', pending: 'badge-sent' };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'connexion.html';
        return;
      }

      document.getElementById('sidebar-user-name').textContent = user.name || user.email.split('@')[0];
      document.getElementById('sidebar-user-role').textContent = user.role || 'Commerçant';

      // Chargement en direct depuis Supabase
      const client = getSupabaseClient();
      if (client) {
        try {
          const field = user.role === 'fournisseur' ? 'supplier_id' : 'merchant_id';
          const { data, error } = await client.from('devis').select('*').eq(field, user.id);
          if (!error && data) {
            userDevis = data;
          }
        } catch (err) {
          console.warn('Erreur chargement devis:', err);
        }
      }

      renderDevis('all');
    });

    function renderDevis(filter = 'all') {
      const tbody = document.getElementById('devis-tbody');
      const filtered = filter === 'all' ? userDevis : userDevis.filter(d => d.status === filter);
      
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#666;">Aucune demande de devis enregistrée.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(d => `
        <tr>
          <td class="devis-number">${d.devis_number || 'DEV-' + d.id.slice(0,6)}</td>
          <td>${d.supplier_id || 'Fournisseur AfroBaza'}</td>
          <td style="font-weight:700;">${Number(d.total_amount_fcfa || 0).toLocaleString('fr-FR')} FCFA</td>
          <td><span class="badge-status ${STATUS_CLASSES[d.status] || 'badge-sent'}">${STATUS_LABELS[d.status] || d.status}</span></td>
          <td>${new Date(d.created_at).toLocaleDateString('fr-FR')}</td>
        </tr>
      `).join('');
    }

    function filterDevis(filter, btn) {
      document.querySelectorAll('.account-content button').forEach(b => b.classList.replace('btn-primary','btn-outline'));
      btn.classList.replace('btn-outline','btn-primary');
      renderDevis(filter);
    }
  </script>
</body>
</html>
