    </aside>

    <main class="account-content">
      <h1>Mes devis</h1>
      <p class="subtitle">Suivez l'état de vos demandes de devis</p>

      <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
        <button class="btn-primary" onclick="filterDevis('all',this)">Tous</button>
        <button class="btn-outline" onclick="filterDevis('sent',this)">Envoyés</button>
        <button class="btn-outline" onclick="filterDevis('accepted',this)">Acceptés</button>
        <button class="btn-outline" onclick="filterDevis('refused',this)">Refusés</button>
      </div>

      <table class="devis-table" id="devis-table">
        <thead>
          <tr>
            <th>N° Devis</th>
            <th>Fournisseur</th>
            <th>Produits</th>
            <th>Date</th>
            <th>Montant estimé</th>
            <th>Statut</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="devis-tbody"></tbody>
      </table>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    const DEVIS_DATA = [
      { num: "DEV-000100", supplier: "Ryn's Home", products: "Beurre de karité (20kg)", date: "06/08/2026", amount: "21 600 FCFA", status: "accepted" },
      { num: "DEV-000099", supplier: "Ryn's Home", products: "Tissu Maylouss (30 pcs)", date: "05/08/2026", amount: "60 000 FCFA", status: "sent" },
      { num: "DEV-000098", supplier: "AgriProduits", products: "Pommes de terre (10 sacs)", date: "03/08/2026", amount: "25 000 FCFA", status: "refused" },
      { num: "DEV-000097", supplier: "BeautyPlus", products: "Palette maquillage (12 pcs)", date: "01/08/2026", amount: "33 600 FCFA", status: "accepted" },
    ];

    const STATUS_LABELS = { sent: 'Envoyé', accepted: 'Accepté', refused: 'Refusé' };
    const STATUS_CLASSES = { sent: 'badge-sent', accepted: 'badge-accepted', refused: 'badge-refused' };

    function renderDevis(filter = 'all') {
      const tbody = document.getElementById('devis-tbody');
      const filtered = filter === 'all' ? DEVIS_DATA : DEVIS_DATA.filter(d => d.status === filter);
      tbody.innerHTML = filtered.map(d => `
        <tr>
          <td class="devis-number">${d.num}</td>
          <td>${d.supplier}</td>
          <td>${d.products}</td>
          <td>${d.date}</td>
          <td style="font-weight:700;">${d.amount}</td>
          <td><span class="badge-status ${STATUS_CLASSES[d.status]}">${STATUS_LABELS[d.status]}</span></td>
          <td><button class="btn-primary" style="padding:6px 14px;font-size:13px;" onclick="showToast('Devis ${d.num} ouvert')">Voir</button></td>
        </tr>
      `).join('');
    }

    function filterDevis(filter, btn) {
      document.querySelectorAll('.account-content button').forEach(b => b.classList.replace('btn-primary','btn-outline'));
      btn.classList.replace('btn-outline','btn-primary');
      renderDevis(filter);
    }

    document.addEventListener('DOMContentLoaded', () => renderDevis());
  </script>
</body>
</html>
