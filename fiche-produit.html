<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beurre de karité brut 100% naturel — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AfroBaza">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#F4B400">
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-actions">
        <button class="icon-btn" onclick="window.history.back()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <a href="panier.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></a>
        <button class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <a href="dashboard.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="categories.html">Catégories</a>
      <a href="fournisseurs.html">Fournisseurs vérifiés</a>
      <a href="a-propos.html">À propos de AfroBaza</a>
      <a href="aide.html">Centre d'aide</a>
    </div>
  </nav>

  <div style="padding: 20px 48px 0;">
    <div class="breadcrumb">
      <a href="index.html">Accueil</a><span class="sep">›</span>
      <a href="categories.html">Cosmétiques et beauté</a><span class="sep">›</span>
      <span>Beurre de karité brut 100% naturel</span>
    </div>
  </div>

  <!-- CONTENU DYNAMIQUE PRODUIT ET FOURNISSEUR -->
  <div class="product-page" id="product-details-container">
    <div style="grid-column:1/-1;text-align:center;padding:60px;color:#666;">Chargement de la fiche produit en direct de Supabase...</div>
  </div>

  <!-- SDK SUPABASE JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    let currentProduct = null;
    let currentSupplier = null;
    let currentQty = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      const container = document.getElementById('product-details-container');
      const client = getSupabaseClient();

      if (!client || !productId) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:red;">Produit non trouvé. Veuillez repasser par le catalogue.</div>';
        return;
      }

      try {
        // 1. Récupérer le produit en BDD
        const { data: prod, error: prodErr } = await client.from('products').select('*').eq('id', productId).single();
        if (prodErr || !prod) throw new Error("Impossible de trouver ce produit.");

        currentProduct = prod;
        currentQty = prod.min_quantity || 1;

        // 2. Récupérer le profil du VRAI fournisseur propriétaire
        let supplierData = null;
        if (prod.supplier_id) {
          const { data: supp } = await client.from('profiles').select('*').eq('id', prod.supplier_id).maybeSingle();
          if (supp) supplierData = supp;
        }
        currentSupplier = supplierData;

        const supplierName = supplierData ? (supplierData.company_name || supplierData.full_name) : 'Fournisseur AfroBaza';
        const supplierLocation = supplierData ? (supplierData.location || 'Dakar, Sénégal') : 'Dakar, Sénégal';
        const supplierAvatar = supplierData ? (supplierData.avatar_url || 'https://images.unsplash.com/photo-1619451334792-150fd785ee74?w=400&q=80') : 'https://images.unsplash.com/photo-1619451334792-150fd785ee74?w=400&q=80';

        container.innerHTML = `
          <!-- GALLERY -->
          <div class="product-gallery">
            <img src="${prod.image_url || 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=700&q=80'}" alt="${prod.name}" id="main-product-img" style="width:100%;max-height:450px;object-fit:cover;border-radius:12px;">
          </div>

          <!-- INFO PRODUIT & VRAI FOURNISSEUR -->
          <div class="product-info">
            <h1>${prod.name}</h1>

            <div class="product-price-display" style="margin: 16px 0;">
              À partir de <strong>${Number(prod.price_fcfa).toLocaleString('fr-FR')} FCFA / ${prod.unit}</strong>
            </div>

            <!-- VRAI FOURNISSEUR PROPRIÉTAIRE -->
            <div style="background:#f8fafc;border:1px solid #e2e8f0;padding:16px;border-radius:10px;margin-bottom:20px;display:flex;align-items:center;gap:14px;">
              <img src="${supplierAvatar}" alt="${supplierName}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">
              <div>
                <div style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;">Fournisseur officiel du produit :</div>
                <div style="font-weight:700;font-size:16px;color:#0f172a;">${supplierName} <span style="color:#16a34a;font-size:13px;">✓ Vérifié</span></div>
                <div style="font-size:12px;color:#64748b;">📍 ${supplierLocation}</div>
              </div>
            </div>

            <div class="availability-card" style="margin-bottom:20px;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
              <div>
                <div><strong>Disponibilité : </strong><span class="status" style="color:#16a34a;font-weight:600;">En stock</span></div>
                <small style="color:#64748b;">Livraison directe sous 24 à 48h</small>
              </div>
            </div>

            <div class="product-meta" style="margin-bottom:20px;">
              <div class="meta-row"><span>Commande minimale (MOQ)</span><span>${prod.min_quantity} ${prod.unit}s</span></div>
              <div class="meta-row"><span>Catégorie</span><span>${prod.category}</span></div>
            </div>

            <div class="product-description" style="margin-bottom:24px;">
              <h3 style="font-size:16px;margin-bottom:8px;">Description du produit</h3>
              <p style="color:#475569;line-height:1.6;">${prod.description || 'Aucune description spécifiée.'}</p>
            </div>

            <div style="margin-bottom:24px;">
              <div style="font-weight:700;margin-bottom:10px;">Quantité souhaitée</div>
              <div class="qty-control" style="display:flex;align-items:center;gap:12px;">
                <button class="qty-btn" onclick="changeQty(-1)" style="padding:6px 16px;font-size:18px;cursor:pointer;">−</button>
                <span class="qty-value" id="qty-display" style="font-weight:700;font-size:16px;">${currentQty} ${prod.unit}s</span>
                <button class="qty-btn" onclick="changeQty(1)" style="padding:6px 16px;font-size:18px;cursor:pointer;">+</button>
              </div>
              <div class="qty-label" style="font-size:12px;color:#64748b;margin-top:6px;">Minimum obligatoire : ${prod.min_quantity} ${prod.unit}s</div>
            </div>

            <div style="display:flex;gap:16px;">
              <button class="btn-primary" onclick="addProductToCart()" style="flex:1;padding:12px;">
                Ajouter au panier
              </button>
              <button class="btn-outline" onclick="window.location.href='panier.html'" style="flex:1;padding:12px;">
                Demander un devis
              </button>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:red;">${err.message}</div>`;
      }
    });

    function changeQty(delta) {
      if (!currentProduct) return;
      const min = currentProduct.min_quantity || 1;
      currentQty = Math.max(min, currentQty + delta);
      document.getElementById('qty-display').textContent = currentQty + ' ' + currentProduct.unit + 's';
    }

    function addProductToCart() {
      if (!currentProduct) return;
      const supplierName = currentSupplier ? (currentSupplier.company_name || currentSupplier.full_name) : 'Fournisseur AfroBaza';
      addToCart({
        id: currentProduct.id,
        supplier_id: currentProduct.supplier_id,
        name: currentProduct.name,
        price: currentProduct.price_fcfa,
        unit: currentProduct.unit,
        img: currentProduct.image_url,
        supplier: supplierName
      }, currentQty);
      showToast('✓ Produit ajouté au panier avec succès !', 'success');
    }
  </script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then(reg => {
        console.log("[AfroBaza PWA] Service Worker enregistr� :", reg.scope);
      }).catch(err => console.warn("[AfroBaza PWA] SW �chec :", err));
    });
  }
</script>
</body>
</html>
