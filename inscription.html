<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-actions">
        <a href="connexion.html" class="btn-outline">Se connecter</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card" style="max-width:580px;">
      <h1>Créer un compte</h1>
      <p class="auth-sub">Rejoignez des milliers de commerçants et fournisseurs</p>

      <!-- Role selection -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;">
        <label id="role-commercant" style="border:2px solid var(--yellow);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;background:var(--yellow-light);" onclick="selectRole('commercant')">
          <div style="font-size:24px;margin-bottom:6px;">🏪</div>
          <div style="font-weight:700;font-size:14px;">Commerçant</div>
          <div style="font-size:12px;color:var(--gray);">Je cherche des fournisseurs</div>
        </label>
        <label id="role-fournisseur" style="border:2px solid var(--gray-border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;" onclick="selectRole('fournisseur')">
          <div style="font-size:24px;margin-bottom:6px;">🏭</div>
          <div style="font-weight:700;font-size:14px;">Fournisseur</div>
          <div style="font-size:12px;color:var(--gray);">Je vends en gros</div>
        </label>
      </div>

      <form onsubmit="handleRegister(event)">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" class="form-control" placeholder="Votre prénom" required>
          </div>
          <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" class="form-control" placeholder="Votre nom" required>
          </div>
        </div>
        <div class="form-group">
          <label for="entreprise">Nom de l'entreprise / boutique (Optionnel)</label>
          <input type="text" id="entreprise" class="form-control" placeholder="Ex: Dakar Commerce">
        </div>
        <div class="form-group">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" class="form-control" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Mot de passe</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 caractères" required minlength="6">
        </div>
        <button type="submit" class="btn-primary auth-submit" id="submit-btn">Créer mon compte Supabase</button>
      </form>

      <div class="auth-footer">Déjà un compte ? <a href="connexion.html">Se connecter</a></div>
    </div>
  </div>

  <!-- SDK SUPABASE JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    let selectedRole = 'commercant';
    function selectRole(role) {
      selectedRole = role;
      document.getElementById('role-commercant').style.borderColor = role === 'commercant' ? 'var(--yellow)' : 'var(--gray-border)';
      document.getElementById('role-commercant').style.background = role === 'commercant' ? 'var(--yellow-light)' : 'transparent';
      document.getElementById('role-fournisseur').style.borderColor = role === 'fournisseur' ? 'var(--yellow)' : 'var(--gray-border)';
      document.getElementById('role-fournisseur').style.background = role === 'fournisseur' ? 'var(--yellow-light)' : 'transparent';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Création du compte... ⏳';
      btn.disabled = true;

      const fullName = document.getElementById('prenom').value + ' ' + document.getElementById('nom').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const company = document.getElementById('entreprise').value;

      const result = await registerUser(email, password, fullName, selectedRole, company);

      if (result.error) {
        showToast('❌ Erreur : ' + result.error, 'error');
        btn.textContent = 'Créer mon compte Supabase';
        btn.disabled = false;
      } else {
        showToast('✓ Compte enregistré dans Supabase !', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1200);
      }
    }
  </script>
</body>
</html>
