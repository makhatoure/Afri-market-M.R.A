<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon panier — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-actions">
        <button class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <a href="panier.html" class="icon-btn" style="color:var(--yellow);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></a>
        <button class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        <a href="dashboard.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="categories.html">Catégories</a>
      <a href="fournisseurs.html">Fournisseurs vérifiés</a>
      <a href="vendre.html">Vendre sur AfroBaza</a>
      <a href="a-propos.html">À propos de AfroBaza</a>
      <a href="aide.html">Centre d'aide</a>
    </div>
  </nav>

  <div class="cart-page">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:24px;">
      <div>
        <h1>Mon panier</h1>
        <p class="cart-subtitle" id="cart-subtitle">3 article(s) chez 1 fournisseur(s)</p>
      </div>
      <button class="btn-outline" onclick="clearCartUI()">Vider le panier</button>
    </div>

    <div id="cart-content"></div>

    <div id="cart-empty" style="display:none;text-align:center;padding:80px 0;">
      <div style="font-size:64px;margin-bottom:16px;">🛒</div>
      <h2 style="font-size:22px;margin-bottom:8px;">Votre panier est vide</h2>
      <p style="color:var(--gray);margin-bottom:24px;">Ajoutez des produits pour commencer</p>
      <a href="index.html" class="btn-primary">Parcourir les produits</a>
    </div>
  </div>

  <!-- SDK SUPABASE JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    let cartItems = [];

    function renderCart() {
      cartItems = getCart(); // Récupère le vrai panier utilisateur (localStorage)

      const content = document.getElementById('cart-content');
      const empty = document.getElementById('cart-empty');
      const subtitle = document.getElementById('cart-subtitle');

      if (!cartItems || cartItems.length === 0) {
        content.innerHTML = '';
        empty.style.display = 'block';
        if (subtitle) subtitle.textContent = '0 article(s) dans le panier';
        return;
      }

      empty.style.display = 'none';
      
      // Groupement par vrai nom de fournisseur
      const groups = {};
      cartItems.forEach((item, index) => {
        const suppName = item.supplier || 'Fournisseur AfroBaza';
        if (!groups[suppName]) groups[suppName] = [];
        groups[suppName].push({ ...item, originalIndex: index });
      });

      const totalCount = cartItems.reduce((s, i) => s + (i.qty || 1), 0);
      const supplierCount = Object.keys(groups).length;
      if (subtitle) subtitle.textContent = `${totalCount} article(s) chez ${supplierCount} fournisseur(s)`;

      let html = '';
      let grandTotal = 0;

      for (const [supplierName, items] of Object.entries(groups)) {
        const groupTotal = items.reduce((s, i) => s + (i.qty * (i.price || 0)), 0);
        grandTotal += groupTotal;

        html += `
          <div class="cart-group" style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:24px;">
            <div class="cart-group-header" style="display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid #f1f5f9;margin-bottom:16px;">
              <div>
                <div style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;">Fournisseur :</div>
                <div style="font-size:18px;font-weight:700;color:#0f172a;">${supplierName} <span style="color:#16a34a;font-size:13px;">✓ Vérifié</span></div>
              </div>
              <button class="btn-primary" onclick="sendQuoteForGroup('${supplierName}')">Envoyer demande de devis</button>
            </div>

            ${items.map(item => `
              <div class="cart-item" style="display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #f8fafc;">
                <img src="${item.img || 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=200&q=80'}" alt="${item.name}" style="width:70px;height:70px;border-radius:8px;object-fit:cover;">
                <div style="flex:1;">
                  <div style="font-weight:700;font-size:15px;">${item.name}</div>
                  <div style="font-size:13px;color:#64748b;">${Number(item.price).toLocaleString('fr-FR')} FCFA / ${item.unit || 'unité'}</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <button class="cart-qty-btn" onclick="changeCartQty(${item.originalIndex}, -1)">−</button>
                  <span style="font-weight:700;">${item.qty}</span>
                  <button class="cart-qty-btn" onclick="changeCartQty(${item.originalIndex}, 1)">+</button>
                </div>
                <div style="font-weight:700;min-width:110px;text-align:right;">
                  ${(item.qty * item.price).toLocaleString('fr-FR')} FCFA
                </div>
                <button class="cart-delete-btn" onclick="removeItem(${item.originalIndex})" style="background:none;border:none;cursor:pointer;color:#ef4444;padding:4px;">🗑️</button>
              </div>
            `).join('')}
          </div>
        `;
      }

      html += `
        <div style="display:flex;justify-content:flex-end;margin-top:16px;">
          <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;min-width:320px;">
            <div style="font-size:18px;font-weight:700;margin-bottom:16px;">Récapitulatif Global</div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;"><span>Articles</span><span>${totalCount}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:1px solid #e2e8f0;padding-top:12px;margin-top:12px;"><span>Total Estimé</span><span>${grandTotal.toLocaleString('fr-FR')} FCFA</span></div>
            <button class="btn-primary" style="width:100%;justify-content:center;margin-top:16px;padding:14px;" onclick="sendAllQuotes()">Envoyer toutes les demandes de devis</button>
          </div>
        </div>
      `;

      content.innerHTML = html;
    }

    function changeCartQty(index, delta) {
      const cart = getCart();
      if (!cart[index]) return;
      cart[index].qty = Math.max(1, cart[index].qty + delta);
      saveCart(cart);
      renderCart();
    }

    function removeItem(index) {
      const cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCart();
      showToast('Article retiré du panier');
    }

    function clearCartUI() {
      if (confirm('Vider le panier ?')) {
        saveCart([]);
        renderCart();
      }
    }

    async function sendQuoteForGroup(supplierName) {
      const user = getCurrentUser();
      if (!user) {
        showToast('Veuillez vous connecter pour envoyer une demande de devis', 'error');
        setTimeout(() => window.location.href = 'connexion.html', 1500);
        return;
      }

      const client = getSupabaseClient();
      if (client) {
        try {
          const itemsToQuote = cartItems.filter(i => (i.supplier || 'Fournisseur AfroBaza') === supplierName);
          await client.from('devis').insert([{
            merchant_id: user.id,
            status: 'En attente',
            total_amount: itemsToQuote.reduce((s, i) => s + (i.qty * i.price), 0),
            items: itemsToQuote
          }]);
        } catch (e) {
          console.warn('Enregistrement Supabase devis:', e);
        }
      }

      showToast(`✓ Demande de devis envoyée avec succès à ${supplierName} !`, 'success');
    }

    async function sendAllQuotes() {
      const user = getCurrentUser();
      if (!user) {
        showToast('Veuillez vous connecter pour envoyer une demande de devis', 'error');
        setTimeout(() => window.location.href = 'connexion.html', 1500);
        return;
      }

      showToast('✓ Vos demandes de devis ont été envoyées aux fournisseurs !', 'success');
      saveCart([]);
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
</body>
</html>
