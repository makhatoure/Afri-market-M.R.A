<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résultats de recherche — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-search-bar">
        <input type="text" id="nav-search-input" class="search-input" placeholder="Beurre de karité" style="min-width:340px;">
        <button class="btn-primary" onclick="doSearch()" style="padding:10px 18px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <div class="nav-actions">
        <a href="panier.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></a>
        <button class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        <button class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <a href="dashboard.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="categories.html">Catégories</a>
      <a href="fournisseurs.html">Fournisseurs vérifiés</a>
      <a href="vendre.html">Vendre sur AfroBaza</a>
      <a href="a-propos.html">À propos de AfroBaza</a>
      <a href="aide.html">Centre d'aide</a>
    </div>
  </nav>

  <div class="search-page">
    <!-- FILTERS -->
    <aside class="filters-panel">
      <div class="filter-card">
        <h3>Catégorie</h3>
        <label class="filter-option"><input type="checkbox" checked> Tous</label>
        <label class="filter-option"><input type="checkbox"> Cosmétiques et beauté (22)</label>
        <label class="filter-option"><input type="checkbox"> Textiles (15)</label>
        <label class="filter-option"><input type="checkbox"> Alimentation (8)</label>
        <label class="filter-option"><input type="checkbox"> Maison (6)</label>
      </div>
      <div class="filter-card">
        <h3>Localisation</h3>
        <label class="filter-option"><input type="checkbox" checked> Tous</label>
        <label class="filter-option"><input type="checkbox"> Dakar</label>
        <label class="filter-option"><input type="checkbox"> Thiès</label>
        <label class="filter-option"><input type="checkbox"> Saint-Louis</label>
        <label class="filter-option"><input type="checkbox"> Autres régions</label>
      </div>
      <div class="filter-card">
        <h3>Prix (FCFA)</h3>
        <div class="price-inputs">
          <input type="number" class="price-input" placeholder="Min" id="price-min">
          <span class="price-sep">+</span>
          <input type="number" class="price-input" placeholder="Max" id="price-max">
        </div>
        <button class="btn-primary" style="width:100%;justify-content:center;" onclick="applyFilters()">Appliquer</button>
      </div>
      <div class="filter-card">
        <h3>Note minimale</h3>
        <label class="filter-option"><input type="radio" name="rating"> Toutes</label>
        <label class="filter-option"><input type="radio" name="rating"> ★ 4+ (23)</label>
        <label class="filter-option"><input type="radio" name="rating"> ★ 3+ (35)</label>
      </div>
    </aside>

    <!-- RESULTS -->
    <div class="results-area">
      <div class="search-results-header">
        <div>
          <h1 id="results-title">Résultat pour "Beurre de karité"</h1>
          <p>48 fournisseurs trouvés</p>
        </div>
        <select class="sort-select">
          <option>Trier par : Pertinence</option>
          <option>Prix croissant</option>
          <option>Prix décroissant</option>
          <option>Mieux notés</option>
          <option>Nouveaux</option>
        </select>
      </div>
      <div id="results-list"></div>
    </div>
  </div>

  <!-- SDK SUPABASE JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderResults);

    async function renderResults() {
      const params = new URLSearchParams(window.location.search);
      const supplierId = params.get('supplier_id');
      const category = params.get('cat');
      const q = params.get('q');

      const title = document.getElementById('results-title');
      const list = document.getElementById('results-list');
      const client = getSupabaseClient();

      if (!client) {
        list.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Erreur de connexion à la base de données.</div>';
        return;
      }

      list.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">Chargement des offres en direct...</div>';

      try {
        let query = client.from('products').select('*');

        if (supplierId) {
          query = query.eq('supplier_id', supplierId);
        } else if (category) {
          query = query.ilike('category', `%${category}%`);
        } else if (q) {
          query = query.ilike('name', `%${q}%`);
        }

        const { data: products, error } = await query;
        if (error) throw error;

        // Récupérer le nom du fournisseur s'il s'agit d'une recherche par fournisseur
        let supplierName = 'Catalogue des offres';
        if (supplierId) {
          const { data: supp } = await client.from('profiles').select('company_name, full_name').eq('id', supplierId).maybeSingle();
          if (supp) supplierName = 'Catalogue de ' + (supp.company_name || supp.full_name);
        }

        if (title) title.textContent = supplierId ? supplierName : (q ? `Résultats pour "${q}"` : 'Toutes les offres');

        if (!products || products.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">Aucun produit disponible pour cette sélection.</div>';
          return;
        }

        list.innerHTML = products.map(p => `
          <div class="supplier-result-card" onclick="window.location.href='fiche-produit.html?id=${p.id}'" style="margin-bottom:20px;cursor:pointer;">
            <div class="supplier-result-img" style="width:160px;height:140px;">
              <img src="${p.image_url || 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=300&q=80'}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">
            </div>
            <div class="supplier-result-info">
              <h3 style="font-size:20px;">${p.name} <span class="badge-verified">✓ Vérifié</span></h3>
              <div class="category" style="color:var(--yellow);font-weight:600;font-size:14px;margin-bottom:4px;">${p.category || 'Général'}</div>
              <div class="price" style="font-size:16px;margin-bottom:4px;">À partir de : <strong>${Number(p.price_fcfa).toLocaleString('fr-FR')} FCFA / ${p.unit}</strong></div>
              <div class="min-qty" style="font-size:14px;color:#64748b;">Quantité min. obligatoire : ${p.min_quantity} ${p.unit}s</div>
            </div>
            <div>
              <button class="btn-primary" onclick="event.stopPropagation();window.location.href='fiche-produit.html?id=${p.id}'">Voir le produit</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        list.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Erreur de chargement du catalogue.</div>';
      }
    }

    function doSearch() {
      const q = document.getElementById('nav-search-input').value.trim();
      window.location.href = `recherche.html?q=${encodeURIComponent(q || 'produits')}`;
    }
    function applyFilters() { showToast('Filtres appliqués', 'success'); }
  </script>
</body>
</html>
