<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fournisseurs vérifiés — AfroBaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-top">
      <a href="index.html" class="logo">Afro<span>Baza</span></a>
      <div class="nav-actions">
        <a href="panier.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></a>
        <a href="dashboard.html" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="categories.html">Catégories</a>
      <a href="fournisseurs.html" class="active">Fournisseurs vérifiés</a>
      <a href="a-propos.html">À propos de AfroBaza</a>
      <a href="aide.html">Centre d'aide</a>
    </div>
  </nav>

  <div class="page-header">
    <h1>Fournisseurs vérifiés</h1>
    <p>Achetez en toute confiance auprès de nos partenaires certifiés par l'équipe AfroBaza</p>
  </div>

  <section class="section" style="max-width: 1200px; margin: 0 auto;" id="suppliers-list">
    <div style="text-align:center;padding:40px;color:#666;">Chargement des fournisseurs vérifiés...</div>
  </section>

  <!-- SDK SUPABASE JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('suppliers-list');
      const client = getSupabaseClient();

      if (!client) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Erreur de connexion aux fournisseurs.</div>';
        return;
      }

      try {
        const { data: allProfiles, error } = await client.from('profiles').select('*');
        if (error) throw error;

        // Filtrage souple pour tous les comptes enregistrés comme fournisseur
        const suppliers = (allProfiles || []).filter(p => p.role && String(p.role).toLowerCase().includes('fournisseur'));

        if (suppliers.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">Aucun fournisseur enregistré sur la plateforme pour le moment.</div>';
          return;
        }

        container.innerHTML = suppliers.map(s => {
          const dispName = s.company_name || s.full_name || (s.email ? s.email.split('@')[0] : 'Fournisseur Certifié');
          return `
            <div class="supplier-result-card" style="margin-bottom:24px;">
              <div class="supplier-result-img" style="width:160px;height:140px;">
                <img src="${s.avatar_url || 'https://images.unsplash.com/photo-1619451334792-150fd785ee74?w=400&q=80'}" alt="${dispName}">
              </div>
              <div class="supplier-result-info">
                <h2 style="font-size:22px;">${dispName} <span class="badge-verified">✓ Vérifié</span></h2>
                <div class="location" style="font-size:14px;margin-bottom:8px;">📍 ${s.location || 'Dakar, Sénégal'}</div>
                <p style="font-size:14px;color:var(--gray);margin-bottom:12px;">Fournisseur certifié AfroBaza — contact direct via demande de devis interne sur les fiches produits.</p>
                <div style="display:flex;align-items:center;gap:12px;">
                  <span class="star-score" style="font-size:16px;">★ 5,0</span>
                  <span class="review-count">Partenaire certifié</span>
                </div>
              </div>
              <div>
                <a href="recherche.html?supplier_id=${s.id}" class="btn-primary">Voir les offres</a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Erreur chargement fournisseurs:', err);
        container.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Impossible de charger la liste des fournisseurs.</div>';
      }
    });
  </script>
</body>
</html>
